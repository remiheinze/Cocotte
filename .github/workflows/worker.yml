name: Deploy Cocotte API Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)
      - run: npm install
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure optional provider secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$FINNHUB_API_KEY" ]; then printf '%s' "$FINNHUB_API_KEY" | npx wrangler secret put FINNHUB_API_KEY; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
      - name: Smoke test deployed Worker
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://cocotte-market-intelligence-api.remiheinze.workers.dev/api/health"
          echo
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "https://cocotte-market-intelligence-api.remiheinze.workers.dev/api/market?market=france" > /tmp/market.json
          node -e "const d=require('/tmp/market.json'); if(!Array.isArray(d.quotes)||!d.quotes.length) process.exit(1); console.log('Market smoke test OK:',d.quotes.length,'quotes')"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "https://cocotte-market-intelligence-api.remiheinze.workers.dev/api/news?market=france" > /tmp/news.json
          node -e "const d=require('/tmp/news.json'); if(!Array.isArray(d.articles)) process.exit(1); console.log('News endpoint OK:',d.articles.length,'articles')"
